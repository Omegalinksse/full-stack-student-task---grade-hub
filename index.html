<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Academic Workspace</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="badge">STUDENT AI STUDIO</div>
      <h1>🎓 Academic Focus & Grade Tracker</h1>
      <p>Interactive web application running live inside the sandboxed preview.</p>
    </header>

    <div class="grid-layout">
      <!-- Quick GPA Estimator -->
      <section class="card">
        <h2>⚡ Semester GPA Estimator</h2>
        <div class="form-group">
          <label>Course Name</label>
          <input type="text" id="courseInput" placeholder="e.g. Data Structures" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Credit Hours</label>
            <input type="number" id="creditInput" value="3" min="1" max="5" />
          </div>
          <div class="form-group">
            <label>Grade</label>
            <select id="gradeInput">
              <option value="4.0">A+ (4.00)</option>
              <option value="3.75">A (3.75)</option>
              <option value="3.50">A- (3.50)</option>
              <option value="3.25">B+ (3.25)</option>
              <option value="3.00">B (3.00)</option>
            </select>
          </div>
        </div>
        <button id="addCourseBtn" class="btn primary-btn">+ Add Course to Calculation</button>

        <div class="result-box">
          <span>Estimated Semester GPA:</span>
          <strong id="gpaDisplay">4.00</strong>
        </div>
      </section>

      <!-- Assignment Task Checklist -->
      <section class="card">
        <h2>📋 Assignment & Study Tasks</h2>
        <div class="input-with-button">
          <input type="text" id="taskInput" placeholder="Add a study milestone or lab task..." />
          <button id="addTaskBtn" class="btn secondary-btn">Add</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
